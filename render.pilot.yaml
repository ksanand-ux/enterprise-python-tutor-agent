# Review-only Blueprint. Applying it creates PAID resources.
# Published compute prices checked 2026-09-23: $7 web + $10 storage/month,
# excluding provider usage, taxes, extra usage and optional platform features.
# https://render.com/pricing
services:
  - type: keyvalue
    name: python-tutor-pilot-usage
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []
  - type: web
    name: python-tutor-pilot
    runtime: docker
    repo: https://github.com/ksanand-ux/enterprise-python-tutor-agent
    branch: codex/invite-only-pilot
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: TUTOR_MODE
        value: pilot
      - key: TUTOR_NAMESPACE
        value: pilot
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: python-tutor-pilot-usage
          property: connectionString
      - key: TUTOR_CALLERS_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: TUTOR_MODEL_ENABLED
        value: "false"
      - key: TUTOR_REQUESTS_PER_MINUTE
        value: "5"
      - key: TUTOR_REQUESTS_PER_DAY
        value: "20"
      - key: TUTOR_GLOBAL_REQUESTS_PER_DAY
        value: "50"
      - key: TUTOR_MAX_CONCURRENT
        value: "2"
      - key: TUTOR_MODEL_TIMEOUT_SECONDS
        value: "45"
      - key: TUTOR_MAX_OUTPUT_TOKENS
        value: "1200"
